services:
  - type: web
    name: quickpay-bank-backend
    env: java
    rootDir: backend
    buildCommand: mvn clean install -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: JAVA_VERSION
        value: 17

  - type: static
    name: quickpay-bank-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
